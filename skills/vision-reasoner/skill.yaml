id: "deepaxiom/cognitive/vision-reasoner"
version: "1.0.0"
protocol: "1"

name: "Vision reasoner"
description: "Reasons over a single object-detection event (from Frigate or any compatible source): always produces a short spoken narration, and separately proposes a gated alert when the event looks actionable. Local model by default; OPENAI_API_KEY switches it to a cloud model — including Gemini via its OpenAI-compatible endpoint."
capability: "cognitive.vision.reasoner"
type: cognitive

format: source
runtime:
  language: python
  version: ">=3.11"

ports:
  ingress:
    - name: event_in
      schema: "std/text@1"
  egress:
    - name: narration_out
      schema: "std/text@1"
    - name: alert_out
      schema: "std/text@1"
    - name: status_out
      schema: "std/status@1"

requirements:
  memory: "2Gi"
  accelerator: any

permissions:
  egress_http: ["huggingface.co", "cdn-lfs.huggingface.co", "api.openai.com", "generativelanguage.googleapis.com"]
  filesystem: "write:~/.aura/models"
  channels: declared-only
