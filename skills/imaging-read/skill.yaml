id: "deepaxiom/cognitive/imaging-read"
version: "0.1.0"
protocol: "1"

name: "Imaging read"
description: "Reads a sample of frames from an imaging study and returns findings with normalised coordinates, a correlation against the report on file, a draft impression and what it could not tell. Cognitive and not motor on purpose: nothing here writes. The draft reaches a record only when a named clinician approves it at the gate, and the effect that writes it cites this inference through its C5 attestation, which names the engine that answered."
capability: "cognitive.imaging.read"
type: cognitive

format: source
runtime:
  language: python
  version: ">=3.11"

ports:
  ingress:
    - name: study_in
      schema: "std/image-study@1"
  egress:
    - name: finding_out
      schema: "std/imaging-finding@1"
    - name: status_out
      schema: "std/status@1"

requirements:
  memory: "512Mi"
  accelerator: none

permissions:
  # One host, and naming it is not approving it: the Gemini API is **not**
  # covered by Google's data processing agreement, and a node that sets a key
  # for it is deciding that these frames leave without that contract behind
  # them. That decision is the deployment's; what this manifest owes is that it
  # is visible here and in the attestation of every read.
  egress_http:
    - "generativelanguage.googleapis.com"
  filesystem: none
  channels: declared-only

config:
  - key: "model"
    type: string
    default: ""
    description: "Model id. Empty means models/gemini-3-flash-preview. Pinned rather than aliased: 'latest' means the reading changes under a clinician without anybody deciding it, and the attestation would name something that no longer exists."
  - key: "thinking"
    type: string
    default: "high"
    description: "How much the model reasons before answering, on the doors that take it. High by default: a read that correlates frames against each other and against a report is not a caption."
  - key: "temperature"
    type: float
    default: 0.0
    min: 0.0
    max: 1.0
    description: "Zero by default. Two reads of the same study should not disagree because of sampling, and a clinician comparing today against last week is entitled to that."
  - key: "max_findings"
    type: int
    default: 12
    min: 1
    max: 32
    description: "Ceiling on what one read returns. A reader that points at forty things has pointed at nothing."
  - key: "language"
    type: string
    default: "es"
    description: "Language of the labels and the draft. It is read by a person, so it follows them and not the model's default."

signature: null
