# A connector spec: the whole authoring cost of connecting a system that has
# no OpenAPI document. Each operation becomes one skill.
#
#   python skills/connector/main.py skills/connector/example.yaml

name: legacy-erp
base_url: http://127.0.0.1:8899

# Credentials come from the environment, never from this file — it ends up in
# git. A referenced variable that is not set is a startup error, not an empty
# header that turns into a confusing 401 later.
headers:
  # Authorization: "Bearer ${ERP_TOKEN}"

operations:
  # GET/HEAD are reads: capability sensorial.api.legacy_erp.get_order, live
  # immediately.
  - op_id: get-order
    method: GET
    path: /orders/{id}
    summary: "Fetch one order by its id."
    params:
      - { name: id, in: path }

  # Anything else is a write: capability motor.api.legacy_erp.create_order.
  # It starts `disabled`, and every edge into it is gated for human approval
  # by the kernel. Promote it when you trust it:
  #
  #   curl -X PUT "localhost:9080/v1/skills/config?id=connector/motor/legacy-erp-create-order" \
  #        -H "Content-Type: application/json" -d '{"mode":"dry-run"}'
  #
  # or just flip it in the Skills tab of the control-plane UI.
  - op_id: create-order
    method: POST
    path: /orders
    summary: "Create an order. Body: {customer, total}."

  # `write` can be set explicitly when the verb lies — a POST /search reads.
  - op_id: search-orders
    method: POST
    path: /orders/search
    summary: "Search orders. Body: {query}."
    write: false
