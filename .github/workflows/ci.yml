name: CI

# The safety net: nothing merges that breaks the build, the tests, or the
# conformance suite. See CONTRIBUTING.md.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  kernel:
    name: kernel (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: kernel/go.mod
          cache-dependency-path: kernel/go.sum

      # gofmt is a hard gate; .gitattributes normalises line endings so this
      # behaves identically on a Windows checkout and here.
      - name: gofmt
        working-directory: kernel
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        working-directory: kernel
        run: go vet ./...

      - name: go build
        working-directory: kernel
        run: go build ./...

      - name: go test
        working-directory: kernel
        run: go test ./... -cover

      # The kernel is concurrent (per-session mutexes, a goroutine writer per
      # socket), so the race detector earns its keep. It needs cgo, which the
      # shipped binary deliberately does not use — hence a separate step:
      # a race report must never be confused with a build problem.
      - name: go test -race
        working-directory: kernel
        env:
          CGO_ENABLED: '1'
        run: go test ./... -race

  vulncheck:
    name: known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: kernel/go.mod
          cache-dependency-path: kernel/go.sum

      # govulncheck reports only vulnerabilities this code actually *reaches*,
      # which is why it can be a hard gate rather than a report nobody reads: a
      # CVE in a dependency's unused half does not fail the build, and one on a
      # path the kernel calls does.
      #
      # Most of what it has ever found here lives in the standard library, so
      # the fix is the toolchain rather than a dependency — which is exactly why
      # the `go` directive in kernel/go.mod names a patch version and every job
      # above reads its Go version from that file. Bumping one line is what
      # closes them, and this job is what says when it is needed.
      - name: govulncheck
        working-directory: kernel
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  ui:
    name: control-plane UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 22, not 20: the graph-model tests run on node:test with
      # --experimental-strip-types, which lands in 22.6.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: install
        working-directory: ui
        run: npm ci

      # The canvas serialises the C2 IR the kernel executes, so its model layer
      # is checked against the same conformance vectors the kernel is.
      - name: test
        working-directory: ui
        run: npm test

      - name: build
        working-directory: ui
        run: npm run build

      # The kernel embeds ui/dist via go:embed, so a source-only change
      # would leave the shipped binary out of sync with the source.
      - name: embedded bundle is up to date
        run: |
          if ! git diff --quiet -- kernel/internal/gateway/ui/dist; then
            echo "ui/ was changed but the embedded bundle was not rebuilt."
            echo "Run 'npm run build' in ui/ and commit kernel/internal/gateway/ui/dist."
            git diff --stat -- kernel/internal/gateway/ui/dist
            exit 1
          fi

  node-sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install
        working-directory: sdk/node
        run: npm install --no-audit --no-fund

      # The types are generated from spec/schemas. If a contract changed and
      # this package was not regenerated, its types are already lying.
      - name: generated types match the frozen schemas
        working-directory: sdk/node
        run: npm run check:generated

      - name: build
        working-directory: sdk/node
        run: npm run build

      - name: test
        working-directory: sdk/node
        run: npm test
        # 23 tests: 6 on framing, 9 on createNode() — the path a full-stack app
        # uses, which had none — and 8 on credential resolution, which did not
        # exist and left the documented six-line integration unable to reach a
        # node with its default auth. Two API bugs came out of writing the
        # createNode ones: start() never resolved, and duplicate names were
        # accepted.

  skills:
    name: first-party skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # websockets is the only `aura` SDK dependency (skill.py imports it at
      # module level) — lightweight, no native build, so every skill's glue
      # code (main.py) is importable here. The heavy, model-specific deps
      # (faster-whisper, llama-cpp-python, piper-tts, psycopg2, pyttsx3) are
      # deliberately NOT installed: modules that need them (engine.py,
      # backends/, parser.py) import them lazily inside a function, never at
      # module level, precisely so their pure logic stays testable here.
      - run: pip install pyyaml websockets

      # The SDK's own credential resolution. It shipped unimplemented, so a
      # skill could not connect to a node running with its default auth at all.
      - name: python SDK
        working-directory: sdk/python
        run: PYTHONPATH=src python -m unittest discover -p 'test_*.py' -v

      # No model is loaded: these cover the streaming buffer, whose failures
      # are silent — a mis-ordered chunk yields a worse transcript, never an
      # error.
      - name: asr
        working-directory: skills/asr
        env:
          PYTHONPATH: ../../sdk/python/src
        run: python -m unittest discover -p 'test_*.py'

      - name: sentence chunker
        working-directory: skills/sentence-chunker
        env:
          PYTHONPATH: ../../sdk/python/src
        run: python -m unittest discover -p 'test_*.py'

      - name: echo
        working-directory: skills/echo
        env:
          PYTHONPATH: ../../sdk/python/src
        run: python -m unittest discover -p 'test_*.py'

      - name: tts
        working-directory: skills/tts
        env:
          PYTHONPATH: ../../sdk/python/src
        run: python -m unittest discover -p 'test_*.py'

      - name: llm-chat
        working-directory: skills/llm-chat
        env:
          PYTHONPATH: ../../sdk/python/src
        run: python -m unittest discover -p 'test_*.py'

      - name: imaging-read
        working-directory: skills/imaging-read
        env:
          PYTHONPATH: ../../sdk/python/src
        run: python -m unittest discover -p 'test_*.py'

      - name: planner
        working-directory: skills/planner
        env:
          PYTHONPATH: ../../sdk/python/src
        run: python -m unittest discover -p 'test_*.py'

      # Stdlib only, so it runs everywhere. Its first test reads
      # model-manager's catalogue and fails if this skill recommends a model
      # that one cannot fetch.
      - name: model fit
        working-directory: skills/model-fit
        env:
          PYTHONPATH: ../../sdk/python/src
        run: python -m unittest discover -p 'test_*.py'

      - name: model manager
        working-directory: skills/model-manager
        env:
          PYTHONPATH: ../../sdk/python/src
        run: python -m unittest discover -p 'test_*.py'

      - name: memory context
        working-directory: skills/memory-context
        env:
          PYTHONPATH: ../../sdk/python/src
        run: python -m unittest discover -p 'test_*.py'

      # test_integration.py needs a real Postgres and is skipped here
      # (adversarial/integration jobs cover that separately); test_parser.py
      # is pure and runs on every push like the rest.
      - name: postgres cdc parser
        working-directory: skills/postgres-cdc
        env:
          PYTHONPATH: ../../sdk/python/src
        run: python -m unittest test_parser -v

  conformance:
    name: conformance suite (C1/C2/C3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: kernel/go.mod
          cache-dependency-path: kernel/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: build the kernel
        working-directory: kernel
        run: go build -o aura ./cmd/aura

      - name: install suite dependencies
        run: pip install websockets jsonschema

      # Black-box, over the raw protocol, against a freshly built binary.
      # --no-auth because this suite speaks the three contracts, not this
      # kernel's access control; the adversarial job below is what exercises
      # that, and it uses a default node precisely so the default is what gets
      # tested.
      - name: run a node and check conformance
        run: |
          ./kernel/aura up --port 9080 --no-auth --data "$RUNNER_TEMP/aura-data" &
          node_pid=$!
          trap 'kill $node_pid 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9080/healthz >/dev/null 2>&1; then break; fi
            if [ "$i" = "30" ]; then echo "node never became healthy"; exit 1; fi
            sleep 1
          done

          python spec/conformance/runner.py --port 9080

          # C4: register a real motor skill, drive two effects through the
          # actual gate-approval path so the kernel seals them for real, then
          # edit kernel.db directly — not through any API the node exposes —
          # and confirm both `aura verify` and GET /v1/ledger/verify say the
          # chain is no longer sound. Runs against the same node and data dir
          # the conformance suite just used, rather than standing up a second
          # one, since sealing an effect needs a live skill and a graph either
          # way.
          python scripts/ledger_adversarial.py --port 9080 \
            --data "$RUNNER_TEMP/aura-data" --aura-binary ./kernel/aura

  adversarial:
    name: adversarial (the node refuses what it should)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: kernel/go.mod
          cache-dependency-path: kernel/go.sum

      - name: build the kernel
        working-directory: kernel
        run: go build -o aura ./cmd/aura

      # Runs a real binary with the DEFAULT flags and checks it refuses what it
      # is meant to refuse: the control surface without a token, a public bind,
      # a world-readable credential, and a graph whose capability the node's
      # policy denies. Testing the hardened path while shipping a permissive
      # default would prove nothing, so the default is what gets tested.
      - name: a default node refuses what it should
        run: ./scripts/adversarial.sh ./kernel/aura

      # `gate: none` is a graph author overruling the human checkpoint; a deny
      # is the operator saying the effect must not happen at all. The claim is
      # that the operator wins BEFORE the effect reaches the skill that would
      # perform it, so this connects a real motor skill for the denied
      # capability and requires that it is handed nothing. adversarial.sh
      # cannot: the refusal arrives over a WebSocket, and its curl-based version
      # of this check was both racy and satisfied by the refusal a node with no
      # policy gives anyway.
      - name: a graph cannot talk its way past a policy deny
        run: |
          pip install --quiet websockets
          python scripts/policy_adversarial.py --port 9141 --data "$RUNNER_TEMP/aura-policy" --aura-binary ./kernel/aura

      # A witness is the party everyone else is asked to rely on, so "the
      # witness can be caught" is the claim that most needs testing the way it
      # would actually be attacked: by editing the database behind a running
      # binary, not by calling an API wrongly. Stands up a witness and a node,
      # anchors real sealed effects, then rewrites an already-published entry
      # in SQLite and requires the monitor to refuse and exit non-zero.
      - name: a witness that rewrites its own log is caught
        run: |
          pip install --quiet websockets
          python scripts/witness_adversarial.py \
            --witness-port 9411 --node-port 9412 \
            --data "$RUNNER_TEMP/aura-witness" --aura-binary ./kernel/aura

      # A scoped token is a security claim, so it is attacked with a real
      # binary: a credential issued for one capability must be refused the
      # control surface, and must be refused registration as any other
      # capability. The second is the load-bearing one — a narrow token free to
      # register as anything is a full token with a smaller name.
      - name: a scoped token cannot act as the operator
        run: |
          ./kernel/aura token issue --data /tmp/tok-ci             --capability logical.echo --label ci > /tmp/tok-out.txt
          SKILL=$(grep -oE '^  [A-Za-z0-9_-]{40,}$' /tmp/tok-out.txt | tr -d ' ')
          test -n "$SKILL" || { echo "FAIL: no token was printed"; exit 1; }
          ./kernel/aura up --port 9131 --data /tmp/tok-ci &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:9131/healthz >/dev/null && break
            sleep 0.25
          done
          OP=$(cat /tmp/tok-ci/node.token)
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code -X POST -H "Authorization: Bearer $SKILL" -d '{}'             http://127.0.0.1:9131/v1/graphs)" = 403             || { echo "FAIL: a skill token registered a graph"; exit 1; }
          test "$(code -H "Authorization: Bearer $SKILL"             http://127.0.0.1:9131/v1/ledger)" = 403             || { echo "FAIL: a skill token read the ledger"; exit 1; }
          test "$(code -H "Authorization: Bearer $OP"             http://127.0.0.1:9131/v1/ledger)" = 200             || { echo "FAIL: the operator was refused its own ledger"; exit 1; }
          test "$(code -H "Authorization: Bearer not-a-real-token"             http://127.0.0.1:9131/v1/ledger)" = 401             || { echo "FAIL: an invented token was not refused"; exit 1; }

      # SIGTERM is what `docker stop`, a pod deletion and `systemctl stop` all
      # send, so it is the shutdown path that runs on every deploy — and until
      # cmd/aura/main.go handled it, none of the careful Close() ordering below
      # it ever executed. This asserts the drain happens AND that the ledger is
      # verifiable afterwards, because a clean-looking log with a corrupt chain
      # would be the worst of both.
      - name: SIGTERM drains rather than kills
        run: |
          pip install --quiet websockets
          ./kernel/aura up --port 9161 --data /tmp/term-ci --no-auth > /tmp/term.log 2>&1 &
          node_pid=$!
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:9161/healthz >/dev/null && break
            sleep 0.25
          done
          # Real sealed effects, so there is something in flight to lose.
          python3 - <<'PY'
          import asyncio, pathlib
          src = pathlib.Path("scripts/ledger_adversarial.py").read_text()
          ns = {}
          exec(compile(src[:src.index("def run_aura_verify")], "seal", "exec"), ns)
          asyncio.run(ns["seal_two_effects"](9161))
          PY
          kill -TERM "$node_pid"
          for i in $(seq 1 40); do
            kill -0 "$node_pid" 2>/dev/null || break
            sleep 0.5
          done
          if kill -0 "$node_pid" 2>/dev/null; then
            echo "FAIL: the node ignored SIGTERM and had to be killed"
            kill -9 "$node_pid"; exit 1
          fi
          cat /tmp/term.log
          grep -q "stopped cleanly" /tmp/term.log \
            || { echo "FAIL: no orderly shutdown; the drain did not run"; exit 1; }
          # The point of draining: what was accepted is on disk and verifies.
          ./kernel/aura verify --data /tmp/term-ci | tee /tmp/term-verify.txt
          grep -q "SOUND" /tmp/term-verify.txt \
            || { echo "FAIL: the ledger did not survive a graceful shutdown"; exit 1; }

      # `/metrics` was served without a token the moment it existed, because the
      # asset rule matched a path shape rather than a route. Any future
      # single-segment route would have been public the same way, so this checks
      # the boundary rather than the one symptom.
      - name: operational endpoints have the right exposure
        run: |
          ./kernel/aura up --port 9171 --data /tmp/ops-ci > /tmp/ops.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:9171/healthz >/dev/null && break
            sleep 0.25
          done
          tok=$(cat /tmp/ops-ci/node.token)
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code http://127.0.0.1:9171/readyz)" = 200 \
            || { echo "FAIL: readiness needs a credential an orchestrator has none of"; exit 1; }
          test "$(code http://127.0.0.1:9171/metrics)" = 401 \
            || { echo "FAIL: /metrics is served without a token"; exit 1; }
          test "$(code -H "Authorization: Bearer $tok" http://127.0.0.1:9171/metrics)" = 200 \
            || { echo "FAIL: /metrics refused the operator"; exit 1; }
          curl -sf -H "Authorization: Bearer $tok" http://127.0.0.1:9171/metrics \
            | grep -q '^aura_store_batch_mean' \
            || { echo "FAIL: the write-path metrics are missing"; exit 1; }

      # The integration path a full-stack team actually uses: an app announces
      # two functions it already has, and `write: true` alone is what makes the
      # kernel gate and seal the second one. Exercised against a real binary
      # because the guarantee is the kernel's, not the SDK's.
      - name: an app exposing its own functions gets a gate it did not write
        run: |
          pip install --quiet websockets
          npm --prefix sdk/node ci --no-audit --no-fund
          npm --prefix sdk/node run build
          ./kernel/aura up --port 9181 --data /tmp/expose-ci --no-auth > /tmp/expose.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:9181/healthz >/dev/null && break
            sleep 0.25
          done
          mkdir -p /tmp/expose-app/node_modules/@deepaxiom
          cp -r sdk/node /tmp/expose-app/node_modules/@deepaxiom/aura
          cp examples/expose-app/app.mjs /tmp/expose-app/
          echo '{"type":"module"}' > /tmp/expose-app/package.json
          ( cd /tmp/expose-app && AURA_WS_URL=ws://127.0.0.1:9181/ws/skill node app.mjs & )
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:9181/v1/skills | grep -q motor.api.shop.refund_order && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:9181/v1/skills | grep -q '"type":"motor"' \
            || { echo "FAIL: write:true did not become a motor capability"; exit 1; }
          curl -sf http://127.0.0.1:9181/v1/skills | grep -q sensorial.api.shop.get_order \
            || { echo "FAIL: the read was not exposed"; exit 1; }
          python3 scripts/expose_gate_check.py --port 9181 \
            || { echo "FAIL: the gate did not fire on an edge that declared none"; exit 1; }
          ./kernel/aura audit --data /tmp/expose-ci | tee /tmp/expose-audit.txt
          grep -q "motor.api.shop.refund_order" /tmp/expose-audit.txt \
            || { echo "FAIL: the effect was not sealed into the ledger"; exit 1; }

      # The compliance deliverable: a period report that verifies from itself.
      # Generated against a ledger with real sealed effects, then checked with
      # no node running, because that second property is the whole product.
      - name: an audit report verifies with no node running
        run: |
          pip install --quiet websockets
          ./kernel/aura up --port 9151 --data /tmp/audit-ci --no-auth &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:9151/healthz >/dev/null && break
            sleep 0.25
          done
          # Reuse the adversarial harness's setup — a real motor skill, a real
          # graph, two real gated effects — without its tampering half.
          python3 - <<'PY'
          import asyncio, pathlib
          src = pathlib.Path("scripts/ledger_adversarial.py").read_text()
          ns = {}
          exec(compile(src[:src.index("def run_aura_verify")], "seal", "exec"), ns)
          asyncio.run(ns["seal_two_effects"](9151))
          PY
          ./kernel/aura audit --data /tmp/audit-ci --out /tmp/audit-ci.json
          out=$(./kernel/aura audit --verify /tmp/audit-ci.json)
          echo "$out"
          echo "$out" | grep -q "SOUND" \
            || { echo "FAIL: a freshly written audit report did not verify"; exit 1; }
          echo "$out" | grep -q "2 verify" \
            || { echo "FAIL: the report did not attach a receipt per gated effect"; exit 1; }

      # The adoption path this command exists for: no node, no port, no setup.
      # If it ever needs `aura up` first, the wedge is gone.
      - name: guard runs with no node standing
        run: |
          pip install --quiet websockets
          cat > /tmp/guard-standalone.json <<'JSON'
          {"mcpServers": {"probe": {"command": "python3",
            "args": ["scripts/ci_mcp_probe.py"]}}}
          JSON
          out=$(./kernel/aura guard --config /tmp/guard-standalone.json                   --port 9141 --data /tmp/guard-standalone --dry-run 2>&1)
          echo "$out"
          echo "$out" | grep -q "running an embedded kernel"             || { echo "FAIL: guard did not start its own node"; exit 1; }
          echo "$out" | grep -q "motor.mcp.probe.write_thing"             || { echo "FAIL: an unannotated tool was not typed motor"; exit 1; }

      # `aura guard` is a safety claim, so the claim gets exercised against a
      # real binary and a real MCP server rather than only in unit tests: an
      # unannotated tool must come back gated, and --trust-annotations must be
      # the only thing that changes that.
      - name: guard types an unannotated tool as gated
        run: |
          ./kernel/aura up --port 9121 --data /tmp/guard-ci --no-auth &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:9121/healthz >/dev/null && break
            sleep 0.25
          done
          cat > /tmp/guard-servers.json <<'JSON'
          {"mcpServers": {"probe": {"command": "python3",
            "args": ["scripts/ci_mcp_probe.py"]}}}
          JSON
          out=$(./kernel/aura guard --config /tmp/guard-servers.json \
                  --port 9121 --dry-run 2>/dev/null)
          echo "$out"
          echo "$out" | grep -q "motor.mcp.probe.write_thing" \
            || { echo "FAIL: an unannotated tool was not typed motor"; exit 1; }
          echo "$out" | grep -q "motor.mcp.probe.read_thing" \
            || { echo "FAIL: an untrusted readOnlyHint escaped the gate"; exit 1; }
          trusted=$(./kernel/aura guard --config /tmp/guard-servers.json \
                      --port 9121 --dry-run --trust-annotations 2>/dev/null)
          echo "$trusted"
          echo "$trusted" | grep -q "sensorial.mcp.probe.read_thing" \
            || { echo "FAIL: --trust-annotations did not take effect"; exit 1; }
          echo "$trusted" | grep -q "motor.mcp.probe.write_thing" \
            || { echo "FAIL: a write was un-gated by --trust-annotations"; exit 1; }

  ssot:
    name: single source of truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml

      # The version lived in three files with two different values, and the
      # five skill types were written out by hand in a Go regex, a Go slice, a
      # Python tuple and the JSON Schemas. Drift is not a build error — it is a
      # skill that registers against one kernel and is rejected by another — so
      # it has to be caught here or not at all.
      - name: generated constants match spec/
        run: python scripts/gen_ssot.py --check

      # The control plane documents every command, contract, schema and enum.
      # None of it is typed by hand, and this is what keeps that true: the
      # generator also fails when the binary offers a command GUIDE.md never
      # documents, so "the reference is complete" is a checked claim rather
      # than an intention.
      - name: the UI reference matches GUIDE.md and spec/
        run: python scripts/gen_ui_reference.py --check

  cross-compile:
    name: binary (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: kernel/go.mod
          cache-dependency-path: kernel/go.sum

      # The kernel is pure Go with a cgo-free SQLite driver, which is what
      # makes "one binary, no external services" true on a Raspberry Pi and a
      # Jetson as well as on a laptop. The claim is only worth making if every
      # target is built on every change.
      - name: build
        working-directory: kernel
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -o "aura-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/aura

      - uses: actions/upload-artifact@v4
        with:
          name: aura-${{ matrix.goos }}-${{ matrix.goarch }}
          path: kernel/aura-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 7

      # The second artefact builds for the same targets. It is a separate module
      # with a separate version line, so nothing about the kernel building says
      # this one does — and an operator running the media subsystem on the same
      # arm64 box as the node is the ordinary case, not an exotic one.
      #
      # It needs its own Go version, which is why setup-go runs again: reading
      # one module's go.mod to build another is how the two version lines start
      # meaning one thing.
      - uses: actions/setup-go@v5
        with:
          go-version-file: media/go.mod
          cache-dependency-path: media/go.sum

      - name: build the media binary
        working-directory: media
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -o "aura-media-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/aura-media

      - uses: actions/upload-artifact@v4
        with:
          name: aura-media-${{ matrix.goos }}-${{ matrix.goarch }}
          path: media/aura-media-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 7

  docs:
    name: documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Broken relative links are how the docs drifted from the repo before;
      # this makes that a build failure instead of a reader's problem.
      - name: no broken relative links
        run: python scripts/check_links.py

  container:
    name: the container actually runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This job exists because every defect it now catches shipped. The image
      # was never built here, so nothing noticed that a first `docker compose
      # up` could not work: the volume was created root-owned under a nonroot
      # process and the node restarted forever on `permission denied`; --policy
      # pointed into an empty volume, which the kernel refuses to boot without;
      # a required variable made compose fail during interpolation; the
      # healthcheck ran a command that exits 0 when its credential is rejected;
      # and the CLI's default data directory disagreed with the node's, so a
      # token minted inside the container went into a database the node never
      # read. All five were found by running this once.
      - name: docker compose config resolves with no variables set
        run: docker compose config >/dev/null

      - name: build the image
        run: docker compose build aura

      - name: it becomes healthy on a fresh volume
        run: |
          docker compose up -d aura
          for i in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q aura)" 2>/dev/null || true)
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && { echo "FAIL: unhealthy"; docker compose logs aura; exit 1; }
            sleep 3
          done
          [ "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q aura)")" = "healthy" ] \
            || { echo "FAIL: never became healthy"; docker compose logs aura; exit 1; }

      - name: the policy it was given is the policy in force
        run: |
          docker compose logs aura | grep -q "aura.policy.yaml" \
            || { echo "FAIL: the mounted policy was not loaded"; exit 1; }
          docker compose logs aura | grep -q "REFUSED (on_seal_failure: refuse)" \
            || { echo "FAIL: on_seal_failure from the policy is not in force"; exit 1; }

      - name: readiness is open and metrics are not
        run: |
          curl -fsS http://localhost:9080/readyz | grep -q '"ready":true' \
            || { echo "FAIL: /readyz did not report ready"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9080/metrics)
          [ "$code" = "401" ] || { echo "FAIL: /metrics answered $code, want 401"; exit 1; }

      # The trap that made a minted token useless: `aura token issue` writes to
      # the CLI's default data directory, and the node has to be reading the
      # same one.
      - name: a token minted inside the container is accepted by the node
        run: |
          token=$(docker compose exec -T aura aura token issue \
            --capability motor.api.shop.refund_order 2>&1 \
            | tr -d '\r' | grep -oE '^[[:space:]]*[A-Za-z0-9_-]{40,}[[:space:]]*$' | tr -d ' ' | head -1)
          [ -n "$token" ] || { echo "FAIL: no token was printed"; exit 1; }
          pip install --quiet websockets
          python3 - "$token" <<'PY'
          import asyncio, sys, websockets
          async def main():
              url = f"ws://localhost:9080/ws/skill?token={sys.argv[1]}"
              async with websockets.connect(url, open_timeout=10):
                  print("the node accepted the scoped token")
          asyncio.run(main())
          PY

      - name: the example app registers, and write:true became a motor capability
        run: |
          token=$(docker compose logs aura | grep -oE '#token=[A-Za-z0-9_-]+' | tail -1 | cut -d= -f2)
          AURA_SKILL_TOKEN="$token" docker compose --profile demo up -d app
          for i in $(seq 1 40); do
            curl -sf -H "Authorization: Bearer $token" http://localhost:9080/v1/skills \
              | grep -q motor.api.shop.refund_order && break
            sleep 3
          done
          catalog=$(curl -sf -H "Authorization: Bearer $token" http://localhost:9080/v1/skills)
          echo "$catalog" | grep -q '"type":"motor"' \
            || { echo "FAIL: write:true did not become a motor capability"; docker compose logs app; exit 1; }
          echo "$catalog" | grep -q sensorial.api.shop.get_order \
            || { echo "FAIL: the read was not exposed"; docker compose logs app; exit 1; }

      # STOPSIGNAL plus an exec-form entrypoint is the whole reason the store's
      # shutdown ordering runs on a deploy. Without it every stop is a SIGKILL.
      - name: SIGTERM drains rather than kills
        run: |
          cid=$(docker compose ps -q aura)
          docker compose stop aura
          code=$(docker inspect --format '{{.State.ExitCode}}' "$cid")
          [ "$code" = "0" ] || { echo "FAIL: exit code $code — 137 means it was killed"; exit 1; }
          docker logs "$cid" 2>&1 | grep -q "stopped cleanly" \
            || { echo "FAIL: the node did not drain"; docker logs "$cid" | tail -20; exit 1; }

      - name: the node identity survives a restart
        run: |
          before=$(docker compose logs aura | grep -oE 'node-[a-f0-9]+' | tail -1)
          docker compose up -d aura
          for i in $(seq 1 40); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q aura)" 2>/dev/null)" = "healthy" ] && break
            sleep 3
          done
          after=$(docker compose logs aura | grep -oE 'node-[a-f0-9]+' | tail -1)
          [ "$before" = "$after" ] \
            || { echo "FAIL: identity changed across a restart ($before -> $after)"; exit 1; }

      - name: always
        if: always()
        run: docker compose --profile demo down -v

  authenticated:
    name: the default node, with its auth on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: kernel/go.mod
          cache-dependency-path: kernel/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # This job exists because three separate credential bugs shipped and
      # every lane stayed green: the Python SDK had no token support at all, so
      # no skill could connect to a default node; the control plane's Sessions
      # view called fetch() with no header and answered 401; and the planner's
      # catalog fetch did the same, which broke `aura do` entirely.
      #
      # None of them could be caught here before, because every other
      # integration job starts its node with --no-auth. That flag is the right
      # default *for a test* — it removes a variable — and it also removed the
      # only lane that exercises what an actual first-run node does. So this
      # one starts a node the way `aura up` starts one, and drives the paths a
      # person drives.
      - name: build
        working-directory: kernel
        run: go build -o aura ./cmd/aura

      - run: pip install --quiet pyyaml websockets

      - name: start a node with its default auth
        run: |
          # No --no-auth, and no --data: the default directory is the one the
          # CLI and both SDKs resolve a token from, and that agreement is half
          # of what this job checks.
          ./kernel/aura up --port 9080 > /tmp/node.log 2>&1 &
          for i in $(seq 1 40); do
            ./kernel/aura ready --port 9080 --quiet && break
            sleep 1
          done
          ./kernel/aura ready --port 9080 || { echo "FAIL: never became ready"; cat /tmp/node.log; exit 1; }
          test -f ~/.aura/node.token || { echo "FAIL: no token was written"; exit 1; }

      - name: the control surface refuses an anonymous request
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9080/v1/skills)
          [ "$code" = "401" ] || { echo "FAIL: /v1/skills answered $code with no token, want 401"; exit 1; }

      # The bug that made the documented first run impossible: a skill started
      # with no environment at all has to find the node's token by itself.
      - name: a skill connects with no configuration whatsoever
        run: |
          ( cd skills/echo && PYTHONPATH=../../sdk/python/src python main.py > /tmp/echo.log 2>&1 & )
          for i in $(seq 1 30); do
            ./kernel/aura status --port 9080 2>/dev/null | grep -q logical.echo && break
            sleep 1
          done
          ./kernel/aura status --port 9080 | grep -q logical.echo \
            || { echo "FAIL: the skill never registered"; cat /tmp/echo.log; exit 1; }

      - name: a session runs end to end
        run: |
          out=$(./kernel/aura chat --port 9080 --graph echo "authenticated hello")
          echo "$out" | grep -q "authenticated hello" \
            || { echo "FAIL: no reply came back, got: $out"; exit 1; }

      # `aura do` is the natural-language path, and the planner behind it reads
      # the catalogue over HTTP — which is exactly where its credential was
      # missing.
      - name: the planner can read the catalogue
        run: |
          ( cd skills/planner && PYTHONPATH=../../sdk/python/src python main.py > /tmp/planner.log 2>&1 & )
          ( cd skills/model-fit && PYTHONPATH=../../sdk/python/src python main.py > /tmp/fit.log 2>&1 & )
          for i in $(seq 1 30); do
            ./kernel/aura status --port 9080 2>/dev/null | grep -q cognitive.planner && break
            sleep 1
          done
          out=$(./kernel/aura do "rank which models fit on this machine" --yes --port 9080 2>&1)
          # `if grep; then fail; fi` rather than `grep && { fail; }`: the second
          # form returns grep's exit code, so on the *healthy* path — where the
          # pattern is absent and grep returns 1 — the step itself fails under
          # the shell's -e. A guard that goes red when nothing is wrong.
          if echo "$out" | grep -qi "401\|could not reach kernel catalog"; then
            echo "FAIL: the planner could not authenticate"
            echo "$out"
            exit 1
          fi
          echo "$out" | grep -q "runnable\|verdict" \
            || { echo "FAIL: no ranking came back"; echo "$out"; cat /tmp/planner.log; exit 1; }

      # Every route the control plane calls on load. A 401 here is the Sessions
      # view bug, which shipped because nothing ever asked these questions of a
      # node that wanted a token.
      - name: every route the UI loads answers with the token
        run: |
          token=$(cat ~/.aura/node.token)
          for path in /v1/skills /v1/graphs /v1/sessions /v1/projections /v1/approvals; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "http://localhost:9080$path")
            [ "$code" = "200" ] || { echo "FAIL: $path answered $code with a valid token"; exit 1; }
          done

      - name: readiness is open, metrics are not
        run: |
          curl -fsS http://localhost:9080/readyz >/dev/null \
            || { echo "FAIL: /readyz needs no credential and must answer"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9080/metrics)
          [ "$code" = "401" ] || { echo "FAIL: /metrics answered $code without a token, want 401"; exit 1; }

      - name: a skill reachable as an MCP tool, with auth
        run: |
          token=$(cat ~/.aura/node.token)
          body=$(curl -s -X POST http://localhost:9080/mcp \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"sensorial_hardware_modelfit","arguments":{"action":"probe"}}}')
          # No quotes in the pattern: MCP returns the skill's payload as a JSON
          # string inside an SSE frame, so every quote in it arrives escaped.
          # Asserting on '"cpu_cores"' fails against a response that contains
          # it — which is what this assertion did until it was run.
          echo "$body" | grep -q 'cpu_cores' \
            || { echo "FAIL: the MCP call did not return a hardware probe"; echo "$body"; exit 1; }

      - name: always
        if: always()
        run: |
          pkill -f 'aura up' || true
          pkill -f 'python main.py' || true

  media:
    name: media subsystem (Go)
    runs-on: ubuntu-latest

    # A real Postgres, because the queue's central claim — N workers dividing
    # the queue with FOR UPDATE SKIP LOCKED rather than queueing behind each
    # other — is a claim about a server. A fake would agree with whatever this
    # code did.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: media
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AURA_MEDIA_TEST_DSN: postgres://postgres:media@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4
      # Its own go.mod, and its own Go version line with it: this artefact is
      # versioned apart from the kernel on purpose, so a codec CVE here is never
      # a reason to move the kernel's version.
      - uses: actions/setup-go@v5
        with:
          go-version-file: media/go.mod
          cache-dependency-path: media/go.sum

      - name: gofmt
        working-directory: media
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        working-directory: media
        run: go vet ./...

      - name: go build
        working-directory: media
        run: go build ./...

      - name: go test
        working-directory: media
        run: go test ./... -cover

      # Workers, leases and one connection per skill: concurrent by
      # construction, so the race detector earns its keep here as much as in the
      # kernel. Separate step and cgo on, for the same reason it is there: a race
      # report must never be confused with a build problem.
      - name: go test -race
        working-directory: media
        env:
          CGO_ENABLED: '1'
        run: go test ./... -race

  media-vulncheck:
    name: known vulnerabilities (media)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: media/go.mod
          cache-dependency-path: media/go.sum

      # The kernel has had this since it had dependencies; this module shipped
      # without it and immediately proved why it is needed — govulncheck found a
      # reachable GO-2025 advisory in golang.org/x/text, pulled in by the
      # Postgres driver and called on every connection this service opens.
      #
      # It also matters more here than anywhere else in the repo: separating
      # this artefact from the kernel was justified BY vulnerability governance
      # — a codec CVE must move this version line and not the kernel's — and a
      # second artefact with no scanner is that argument abandoned.
      - name: govulncheck
        working-directory: media
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  media-e2e:
    name: media end to end (real ffmpeg)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: media
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: media/go.mod
          cache-dependency-path: media/go.sum

      # Installed rather than assumed. Which runner image ships ffmpeg is not a
      # promise anybody made to this repository, and a job that fails because a
      # base image changed teaches nothing about the code.
      - name: ffmpeg
        run: |
          command -v ffmpeg >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          }
          ffmpeg -version | head -1

      - name: build the binary
        working-directory: media
        run: go build -ldflags "-X main.version=$(cat VERSION)" -o aura-media ./cmd/aura-media

      # Everything this covers is invisible to a unit test: whether the argv the
      # builders produce is argv ffmpeg accepts, whether the package it writes is
      # one a player can read, and whether the address handed back serves bytes.
      # Two bugs came out of running it — an idempotency key honoured after the
      # upload rather than before it, and a rendition width two pixels off what
      # the playlist claimed — and neither was visible to anything else.
      - name: an asset in, an address out
        env:
          AURA_MEDIA_TEST_DSN: postgres://postgres:media@localhost:5432/postgres
        run: ./scripts/media_e2e.sh ./media/aura-media

      - name: always
        if: always()
        run: pkill -f 'aura-media serve' || true
