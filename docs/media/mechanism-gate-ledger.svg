<text class="h" x="346" y="188">kernel · Effect Checkpoint</text>
<rect class="bx" x="346" y="196" width="112" height="22" rx="6"/>
<rect class="bx" x="462" y="196" width="112" height="22" rx="6"/>
<rect class="bx" x="346" y="226" width="112" height="22" rx="6"/>
<rect class="bx" x="462" y="226" width="112" height="22" rx="6"/>
<text class="m c" x="402" y="211">1 classify</text>
