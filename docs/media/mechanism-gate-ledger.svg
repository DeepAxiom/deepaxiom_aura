<text class="m c" x="402" y="241">3 attest</text>
<text class="m c" x="518" y="241">4 deliver</text>
<rect class="oa t c1" x="346" y="196" width="112" height="22" rx="6"/>
<rect class="og t c2" x="462" y="196" width="112" height="22" rx="6"/>
<rect class="oa t c3" x="346" y="226" width="112" height="22" rx="6"/>
<rect class="oa t c4" x="462" y="226" width="112" height="22" rx="6"/>

<rect class="pn" x="32" y="184" width="148" height="64" rx="8" style="stroke:#a78bfa"/>
<text class="h c" x="106" y="211">Expertise</text>
<text class="m c" x="106" y="231" style="fill:var(--dm)">cognitive</text>
<rect class="pn" x="760" y="184" width="168" height="64" rx="8" style="stroke:#f9735b"/>
<text class="h c" x="844" y="211">Expertise</text>
<text class="m c" x="844" y="231" style="fill:var(--dm)">motor.erp.write</text>
<rect class="oa t dv" x="760" y="184" width="168" height="64" rx="8"/>

<g class="t ea">
<rect class="bx" x="184" y="205" width="44" height="22" rx="5" style="fill:var(--pn);stroke:var(--dm)"/>
<rect class="og t eh" x="184" y="205" width="44" height="22" rx="5"/>
<text class="m c" x="206" y="220">data</text>
</g>
<text class="c gt t eh" x="255" y="197" font-size="12.5">held, not delivered</text>
<g class="t eb">
<rect x="596" y="205" width="52" height="22" rx="5" fill="var(--pn)" stroke="var(--ac)" stroke-width="1.5"/>
<path d="M640 205.75h3a4.25 4.25 0 0 1 4.25 4.25v12a4.25 4.25 0 0 1-4.25 4.25h-3z" fill="var(--ac)"/>
<text class="m c" x="618" y="220">data</text>
</g>
<text class="m c act t rc" x="675" y="197">receipt: sha256:c41d…</text>

<path class="t sp" d="M460 264V290H793V304"/>
<path class="act t en" d="M788 300l5 8 5-8z"/>
<text class="f" x="474" y="283">Seal(): append entry, return its hash as receipt</text>
<text class="f" x="32" y="298">ledger: each entry's prev is the previous entry's hash</text>

<g class="m">
<rect class="pn" x="32" y="308" width="270" height="156" rx="8"/>
