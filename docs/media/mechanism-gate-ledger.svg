<text class="k" x="46" y="346">prev</text><text x="160" y="346">sha256:07be…</text>
<text class="k" x="46" y="362">capability</text><text x="160" y="362">motor.mail.send</text>
<text class="k" x="46" y="378">decision</text><text x="160" y="378">allow</text>
<text class="k" x="46" y="394">outcome</text><text x="160" y="394">delivered</text>
<text class="k" x="46" y="410">payload_sha256</text><text x="160" y="410">e3a1…</text>
<path class="ln" d="M32 438H302"/>
<text class="k" x="46" y="455">hash(entry)</text><text class="hv" x="160" y="455">sha256:5d10…</text>

