<text class="k" x="359" y="346">prev</text><text class="hv" x="473" y="346">sha256:5d10…</text>
<text class="k" x="359" y="362">capability</text><text x="473" y="362">motor.erp.write</text>
<text class="k" x="359" y="378">decision</text><text x="473" y="378">gate</text>
<text class="k" x="359" y="394">outcome</text><text x="473" y="394">denied</text>
<text class="k" x="359" y="410">payload_sha256</text><text x="473" y="410">70cf…</text>
<path class="ln" d="M345 438H615"/>
<text class="k" x="359" y="455">hash(entry)</text><text class="hv" x="473" y="455">sha256:9f2a…</text>

<rect class="t es" x="658" y="308" width="270" height="156" rx="8" fill="none" stroke="var(--bd)" stroke-width="1.5" stroke-dasharray="5 5"/>
<text class="k c t es" x="793" y="390">next entry: seq 43</text>
<g class="t en">
<rect class="pn" x="658" y="308" width="270" height="156" rx="8" style="stroke:var(--ac)"/>
<text class="k" x="672" y="330">seq</text><text x="786" y="330">43</text>
