<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
<title id="t">Delta coalescing</title>
<desc id="d">A timeline from 0 to 100 milliseconds. A model emits fourteen small text deltas. The first delta is emitted as an envelope immediately. Later deltas that arrive inside the max_delay window of 25 milliseconds after the previous flush are buffered and emitted together as one envelope when the timer fires. A buffer that reaches max_chars, 256 characters, is flushed at once without waiting for the timer. close() flushes what is left, and the final marker is still sent as its own envelope. Fourteen deltas become five text envelopes plus the final marker, and the concatenated text is identical.</desc>
<style>
svg{--bg:#f6f6f3;--pn:#fff;--bd:#d9d9d2;--tx:#17191c;--dm:#4f5661;--ft:#7a818c;--ac:#4d7c0f;--af:#a6d92c;--gt:#b45309;--er:#c8322f;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#0d0e10;--pn:#15171a;--bd:#2a2e34;--tx:#e8eaed;--dm:#a2a9b3;--ft:#6f7782;--ac:#b8e83a;--af:#b8e83a;--gt:#f0a429;--er:#f0524f}}
.bg{fill:var(--bg);stroke:var(--bd);stroke-width:1.5}
.pn{fill:var(--pn);stroke:var(--bd);stroke-width:1.5}
.bx{fill:var(--pn);stroke:var(--bd);stroke-width:1.5}
.ex{fill:var(--pn);stroke:var(--ac);stroke-width:1.5}
text{fill:var(--tx);font-size:12.5px}
.cap{fill:var(--ft);font-size:12px;letter-spacing:.12em;font-weight:600}
.s{fill:var(--dm)}
.f{fill:var(--ft);font-size:12px}
.m{font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,Menlo,monospace;font-size:12px}
.c{text-anchor:middle}.e{text-anchor:end}
.ln{stroke:var(--bd);stroke-width:1.5;fill:none}
.br{stroke:var(--ac);stroke-width:1.5;fill:none}
.w{stroke:var(--ft);stroke-width:4;stroke-linecap:round}
.wd{stroke:var(--ft);stroke-width:1.5;stroke-dasharray:3 4}
.t{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:linear}
.ph{stroke:var(--ac);stroke-width:1.5;animation-name:ph}
@keyframes ph{0%,3%{opacity:0;transform:translateX(0)}4%{opacity:1;transform:translateX(0)}87.3%{opacity:1;transform:translateX(880px)}90%,100%{opacity:0;transform:translateX(880px)}}
.t1{animation-name:t1}.t2{animation-name:t2}.t3{animation-name:t3}.t4{animation-name:t4}.t5{animation-name:t5}.t6{animation-name:t6}.t7{animation-name:t7}.t8{animation-name:t8}.t9{animation-name:t9}.t10{animation-name:t10}.t11{animation-name:t11}.t12{animation-name:t12}.t13{animation-name:t13}.t14{animation-name:t14}
.e1{animation-name:e1}.e2{animation-name:e2}.e3{animation-name:e3}.e4{animation-name:e4}.e5{animation-name:e5}.e6{animation-name:e6}
@keyframes t1{0%,3.7%{opacity:0}4%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes t2{0%,8.5%{opacity:0}8.8%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes t3{0%,13.3%{opacity:0}13.6%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes t4{0%,18%{opacity:0}18.3%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes t5{0%,22.8%{opacity:0}23.1%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes t6{0%,27.6%{opacity:0}27.9%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes t7{0%,32.3%{opacity:0}32.6%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes t8{0%,37.1%{opacity:0}37.4%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes t9{0%,41.9%{opacity:0}42.2%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes t10{0%,46.7%{opacity:0}47%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes t11{0%,51.4%{opacity:0}51.7%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes t12{0%,56.2%{opacity:0}56.5%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes t13{0%,65.8%{opacity:0}66.1%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes t14{0%,70.5%{opacity:0}70.8%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes e1{0%,4%{opacity:0}4.4%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes e2{0%,23.6%{opacity:0}24%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes e3{0%,43.5%{opacity:0}43.9%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes e4{0%,56.6%{opacity:0}57%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes e5{0%,73.7%{opacity:0}74.1%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes e6{0%,79.6%{opacity:0}80%,95%{opacity:1}98%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-play-state:paused!important}.t{animation-delay:-10.9s!important}}
</style>
<rect class="bg" x=".75" y=".75" width="958.5" height="418.5" rx="12"/>
<text class="cap" x="24" y="32">DELTA COALESCING</text>

