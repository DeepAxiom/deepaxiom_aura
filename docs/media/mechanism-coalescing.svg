<g class="t t4"><rect class="bx" x="199" y="142" width="44" height="24" rx="6"/><text x="221" y="158">has</text></g>
<g class="t t5"><rect class="bx" x="250" y="142" width="44" height="24" rx="6"/><text x="272" y="158">its</text></g>
