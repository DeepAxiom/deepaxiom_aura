<g class="t t7"><rect class="bx" x="350" y="142" width="44" height="24" rx="6"/><text x="372" y="158">mail</text></g>
<g class="t t8"><rect class="bx" x="401" y="142" width="44" height="24" rx="6"/><text x="423" y="158">box</text></g>
<g class="t t9"><rect class="bx" x="451" y="142" width="44" height="24" rx="6"/><text x="473" y="158">.</text></g>
<g class="t t10"><rect class="bx" x="502" y="142" width="44" height="24" rx="6"/><text x="524" y="158">96 ch</text></g>
<g class="t t11"><rect class="bx" x="552" y="142" width="44" height="24" rx="6"/><text x="574" y="158">96 ch</text></g>
<g class="t t12"><rect class="bx" x="602" y="142" width="44" height="24" rx="6"/><text x="624" y="158">64 ch</text></g>
<g class="t t13"><rect class="bx" x="703" y="142" width="44" height="24" rx="6"/><text x="725" y="158">so</text></g>
<g class="t t14"><rect class="bx" x="754" y="142" width="44" height="24" rx="6"/><text x="776" y="158">on</text></g>

<g class="t e1"><path class="br" d="M70 166V212"/><rect class="ex" x="48" y="212" width="44" height="24" rx="6"/><text x="70" y="228">Each</text></g>
<g class="t e2"><path class="br" d="M98 170V174H294V170M262 174V212"/><rect class="ex" x="258" y="212" width="132" height="24" rx="6"/><text x="324" y="228">session has its</text></g>
<g class="t e3"><path class="br" d="M300 170V174H495V170M472 174V212"/><rect class="ex" x="468" y="212" width="110" height="24" rx="6"/><text x="523" y="228">own mailbox.</text></g>
<g class="t e4"><path class="br" d="M502 170V174H646V170M606 174V212"/><rect class="ex" x="602" y="212" width="84" height="24" rx="6"/><text x="644" y="228">256 chars</text></g>
<g class="t e5"><path class="br" d="M703 170V174H798V170M791 174V212"/><rect class="ex" x="787" y="212" width="56" height="24" rx="6"/><text x="815" y="228">so on</text></g>
<g class="t e6"><rect class="ex" x="851" y="212" width="64" height="24" rx="6" style="stroke:var(--tx)"/><text x="883" y="228">final</text></g>
