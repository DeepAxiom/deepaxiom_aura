<text class="f" x="48" y="56">0 ms</text><text class="f c" x="258" y="56">25</text><text class="f c" x="468" y="56">50</text><text class="f c" x="678" y="56">75</text><text class="f c" x="888" y="56">100 ms</text>
<path class="w" d="M50 78H256M470 78H600M260 88H466M604 88H785"/>
<path class="wd" d="M606 78H678M791 88H812"/>
<text class="f" x="48" y="110">windows: max_delay = 25 ms after each flush; dashed = flushed before the timer fired</text>
<text class="f" x="48" y="134">deltas from the model, one add() each</text>

<g class="m c">
<g class="t t1"><rect class="bx" x="48" y="142" width="44" height="24" rx="6"/><text x="70" y="158">Each</text></g>
<g class="t t2"><rect class="bx" x="98" y="142" width="44" height="24" rx="6"/><text x="120" y="158">ses</text></g>
