<text class="f" x="104" y="228">envelopes emitted</text>
<text class="f t e1" x="48" y="254">first delta: sent at once</text>
<text class="f t e2" x="258" y="254">timer fired: max_delay</text>
<text class="f t e3" x="468" y="254">timer fired: max_delay</text>
<text class="f t e4" x="602" y="254">max_chars = 256 reached</text>
<text class="f t e5" x="787" y="254">close()</text>
<text class="f t e6" x="851" y="254">own envelope</text>
<path class="t ph" d="M48 62V262"/>

<rect class="pn" x="24" y="276" width="912" height="120" rx="8"/>
<text class="s" x="44" y="301">same text, fewer envelopes</text>
<text class="s e" x="916" y="301">14 deltas in; 5 text envelopes + the final marker out</text>
<text class="m" x="44" y="328" style="fill:var(--ft)">deltas</text><text class="m" x="124" y="328">Each| ses|sion| has| its| own| mail|box|.</text>
<text class="m" x="44" y="348" style="fill:var(--ft)">envelopes</text><text class="m" x="124" y="348">Each| session has its| own mailbox.</text>
<text class="f" x="44" y="378">std/text@1 partials are deltas that consumers append, so both streams read the same; ordering and the causal chain are unchanged</text>
</svg>
