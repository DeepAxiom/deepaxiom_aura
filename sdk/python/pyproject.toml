[project]
name = "aura-sdk"
version = "5.0.0a1"
description = "SDK v5 for building Skills against the AURA kernel (contracts C1/C3)"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
