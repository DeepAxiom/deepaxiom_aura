id: "example/sensorial/asr"
version: "1.2.0"
protocol: "1"

name: "Speech to text"
description: "Transcribes speech using a local Whisper model (faster-whisper, CPU-friendly). Takes either a whole WAV on audio_in, or a live PCM stream on audio_chunk_in with partial results while the person is still speaking. Downloads the model on first use."
capability: "sensorial.asr.transcribe"
type: sensorial

format: source
runtime:
  language: python
  version: ">=3.11"

ports:
  ingress:
    # A whole file, transcribed once.
    - name: audio_in
      schema: "std/document@1"
    # A live stream. A separate port because C1 binds one schema per port, and
    # these two genuinely carry different things.
    - name: audio_chunk_in
      schema: "std/audio-chunk@1"
  egress:
    # The settled transcript only — this is what an LLM should answer.
    # Partials must never come out here: `text` in std/text@1 is a delta that
    # consumers concatenate, so a chat skill would answer four half-sentences.
    - name: text_out
      schema: "std/text@1"
    # Partials and the final, each replacing the last. This is what a UI shows.
    # With streaming_policy=local_agreement each payload also carries
    # `stable_chars` (additive): text[:stable_chars] is committed and will not
    # change in later partials. A consumer that ignores it loses nothing.
    - name: transcript_out
      schema: "std/transcript@1"
    - name: status_out
      schema: "std/status@1"

requirements:
  memory: "1Gi"
  accelerator: any

permissions:
  egress_http: ["huggingface.co", "cdn-lfs.huggingface.co"]
  filesystem: "write:~/.aura/models"
  channels: declared-only

config:
  - key: "model_size"
    type: enum
    default: "base"
    options: ["tiny", "base", "small", "medium", "large-v3"]
    description: "Whisper size. Bigger is more accurate and slower; on CPU, 'base' is usually the largest that keeps up with live partials on a laptop."
    restart_required: true
  - key: "language"
    type: string
    default: ""
    description: "Language hint, e.g. 'es'. Empty autodetects, which costs accuracy on short utterances."
  - key: "partials_enabled"
    type: bool
    default: true
    description: "Emit interim hypotheses while the person is still speaking. Turn it off on slow hardware — the final transcript is unaffected."
  - key: "partial_interval_ms"
    type: int
    default: 900
    min: 200
    max: 5000
    description: "How much NEW audio to gather before re-decoding for a partial. Whisper has no incremental decode and pads to a fixed 30s window, so a partial costs roughly the same whatever the buffer holds — measured around 750ms for 'base' on a laptop CPU, which is why the default sits just above that. It backs off on its own if the machine cannot keep up."
  - key: "max_utterance_s"
    type: int
    default: 15
    min: 2
    max: 120
    description: "Hard cap before the utterance is finalised regardless. Stops a stuck client holding a transcript open forever."
  - key: "silence_endpoint_ms"
    type: int
    default: 800
    min: 200
    max: 5000
    description: "Trailing quiet before the utterance is considered over. A safety net: a client that does its own endpointing should send final=true rather than rely on this."
  - key: "silence_rms"
    type: int
    default: 500
    min: 0
    max: 10000
    description: "Loudness below which a chunk counts as silence, in PCM16 units. Raise it in a noisy room."
  - key: "preload_on_boot"
    type: bool
    default: true
    description: "Load the Whisper model in a background thread as soon as the skill starts, instead of on the first request. Keeps the first utterance from paying the 10-30s model load and timing out. Replaces the old AURA_ASR_PRELOAD environment variable."
    restart_required: true
  - key: "beam_size_final"
    type: int
    default: 5
    min: 1
    max: 10
    description: "Beam width for the settled transcript (both the whole-file path and the end of a stream). Higher is more accurate and slower; unlike partials this only runs once per utterance, so it can afford a wider beam."
  - key: "beam_size_partial"
    type: int
    default: 1
    min: 1
    max: 10
    description: "Beam width for interim partials while the person is still speaking. Kept narrow by default because a partial is re-decoded on every interval and has to stay fast enough to keep up with live audio."
  - key: "streaming_policy"
    type: enum
    default: "redecode"
    options: ["redecode", "local_agreement"]
    description: "How partials are produced. 'redecode' (default, the long-standing behaviour): every partial decodes the last 10s from scratch and the final decodes the whole utterance; any word can change until the final. 'local_agreement' (experimental, opt-in): each partial decodes only the audio whose words are not settled yet, words that two consecutive hypotheses agree on are committed and never change, and the final is the committed words plus one decode of the remaining tail. Partials then also carry 'stable_chars'. What it buys is a prefix that stops flickering, not speed: in the one manual run against a real model ('base' on a laptop CPU, two synthetic clips) partials cost the same as under 'redecode', the final was faster on one clip and slower on the other, and the final transcript matched 'redecode' on one clip and was worse in three words on the other, because a committed word is never revised. Otherwise covered only by unit tests against a scripted decoder; CI does not run it against a model. Try it on your own audio before relying on it."
  - key: "final_redecode"
    type: bool
    default: false
    description: "Only with streaming_policy=local_agreement: decode the whole utterance again for the final, as 'redecode' does, instead of committed words + the remaining tail. Gives the final the accuracy of 'redecode' while partials keep their stable prefix; the price is that the final may then differ from text that partials reported as stable. No effect under 'redecode', which always does this."
  - key: "device"
    type: enum
    default: "cpu"
    options: ["auto", "cpu", "cuda"]
    description: "Where the model runs. 'cpu' is the long-standing behaviour. 'auto' uses CUDA when ctranslate2 reports a device and falls back to cpu/int8 (logging why) if loading on the GPU fails. 'cuda' fails loudly instead of falling back. A CUDA setup that loads but fails on its first inference is not caught by 'auto'."
    restart_required: true
  - key: "compute_type"
    type: enum
    default: "int8"
    options: ["auto", "int8", "int8_float16", "int16", "float16", "float32"]
    description: "ctranslate2 quantisation. 'int8' is the long-standing behaviour and the right choice on CPU. 'auto' picks float16 on CUDA and int8 on CPU. Any other value is passed to ctranslate2 as is; a combination the device cannot run is its error to raise."
    restart_required: true

signature: null
